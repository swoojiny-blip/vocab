<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>한자 연습장</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한자 연습장">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3eee2">
<style>
  :root{
    --paper:#f3eee2; --paper2:#fbf8f1; --ink:#171510; --red:#b8402c; --line:rgba(184,64,44,.38);
    --muted:#7b7566; --edge:#d9d1bf; --btn:#ece5d3; --btn2:#e2d9c3;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);overscroll-behavior:none;
    font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
  #app{height:100vh;height:100dvh;display:flex;flex-direction:column;
    padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l)}
  header{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--edge)}
  header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em}
  header h1 small{font-weight:500;color:var(--muted);font-size:13px;margin-left:8px}
  header .sp{flex:1}
  .courses{display:flex;gap:6px;margin-left:10px}
  .courses button{height:40px;font-size:15px;padding:0 14px;border-radius:20px}
  #pos{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
  main{flex:1;min-height:0;display:flex}
  #left{flex:0 0 40%;display:flex;flex-direction:column;padding:14px 16px 10px 18px;border-right:1px solid var(--edge);min-width:0}
  #right{flex:1;display:flex;flex-direction:column;padding:10px 18px 10px 16px;min-width:0;background:var(--paper2)}
  .bigwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  .bigbox{position:relative;background:var(--paper2);border:2px solid var(--red);border-radius:4px}
  .bigbox svg{position:absolute;inset:0;width:100%;height:100%}
  .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:"Hiragino Mincho ProN","Songti TC","Noto Serif CJK TC","Noto Serif KR","Apple Myungjo",serif;line-height:1}
  .reading{display:flex;align-items:baseline;justify-content:center;gap:14px;padding-top:10px}
  .reading .hun{font-size:30px;font-weight:700}
  .reading .eum{font-size:38px;font-weight:800;color:var(--red)}
  .reading .sc{font-size:14px;color:var(--muted);margin-left:8px}
  .phrase{display:flex;justify-content:center;gap:8px;padding-top:6px}
  .phrase .pc{width:64px;text-align:center;padding:4px 0;border-radius:8px}
  .phrase .pc b{display:block;font-size:30px;font-weight:500;
    font-family:"Hiragino Mincho ProN","Songti TC","Noto Serif CJK TC","Noto Serif KR","Apple Myungjo",serif}
  .phrase .pc i{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
  .phrase .pc.cur{background:rgba(184,64,44,.12);outline:1.5px solid var(--red)}
  .meta{font-size:14px;color:var(--muted);text-align:center;padding-top:4px}
  .meta b{color:var(--red);font-weight:700}
  .xr{font-size:14px;color:var(--ink);text-align:center;padding-top:4px}
  .reading .hun.long{font-size:22px}
  .mrow{padding-top:8px}
  .mrow button{width:100%;height:50px}
  button.ok{background:#2f7d4f;color:#fff;border-color:#2f7d4f}
  button.ok:active{background:#256340}
  .idm{font-size:13.5px;line-height:1.45;text-align:center;padding-top:6px;color:var(--ink)}
  .idm b{font-size:16px;color:var(--red)}
  .idm .lv{color:var(--muted);font-size:12px;margin-left:6px}
  .mdone{color:#2f7d4f;font-weight:700}
  #toast{position:fixed;left:50%;top:calc(70px + var(--safe-t));transform:translateX(-50%);z-index:30;background:rgba(23,21,16,.92);color:#fff;
    padding:12px 18px;border-radius:14px;font-size:15px;display:flex;gap:14px;align-items:center;max-width:90vw}
  #toast[hidden]{display:none}
  #toast button{height:34px;font-size:14px;padding:0 12px;background:#fff;color:var(--ink);border:0;border-radius:10px}
  .dtabs{display:flex;gap:6px;padding:10px 14px 0}
  .dtabs button{flex:1;height:44px;border-radius:12px}
  #dopts{padding:10px 14px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  #dopts .info{font-size:13px;color:var(--muted);flex-basis:100%}
  #dopts button{height:38px;font-size:14px;padding:0 12px}
  .dgrp{font-size:14px;font-weight:700;color:var(--red);padding:12px 2px 6px}
  .dcgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .dchip{height:78px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:12px;background:#e6dcc0}
  .dchip b{font-size:26px;font-weight:500;font-family:"Hiragino Mincho ProN","Songti TC","Noto Serif CJK TC","Noto Serif KR","Apple Myungjo",serif;line-height:1.1}
  .dchip.idi{grid-column:span 2}
  .dchip.idi b{font-size:24px;letter-spacing:.04em}
  .dchip i{font-style:normal;font-size:12px;color:#5d5748}
  .drow button.mst,.dgrid button.mst{background:#cfe3d5;color:#4a6b57}
  .drow button.mst::after,.dgrid button.mst::after{content:"✓";font-size:12px;vertical-align:top;margin-left:2px}
  #dbackup{padding:12px 14px;border-top:1px solid var(--edge);background:var(--paper)}
  #dbackup[hidden]{display:none}
  #dbackup p{margin:0 0 8px;font-size:13px;color:var(--muted);line-height:1.5}
  #dbackup textarea{width:100%;height:110px;font-size:12px;border:1px solid var(--edge);border-radius:8px;padding:8px;-webkit-user-select:text;user-select:text}
  #dbackup .br{display:flex;gap:8px;margin-top:8px}
  .note{font-size:12.5px;color:var(--muted);text-align:center;padding-top:6px;min-height:20px}
  .panebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:8px;min-height:50px}
  .panebar .ttl{font-weight:700;font-size:16px;margin-right:6px}
  .panebar .hint{font-size:13px;color:var(--muted)}
  .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  .box{position:relative;background:#fff;border:2px solid var(--red);border-radius:4px;box-shadow:0 1px 0 rgba(0,0,0,.04)}
  .box>*{position:absolute;inset:0;width:100%;height:100%}
  .grid rect{stroke:var(--red);stroke-width:2;fill:none;vector-effect:non-scaling-stroke}
  .grid path{stroke:var(--line);stroke-width:1;fill:none;vector-effect:non-scaling-stroke}
  .demo{pointer-events:none}
  .bd circle{fill:rgba(255,255,255,.9);stroke:#a39c88;stroke-width:5}
  .bd text{fill:#7a7466;font-size:46px;font-weight:700;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif}
  .bd.on circle{fill:#c4553d;stroke:#c4553d}
  .bd.on text{fill:#fff}
  .nums-off .bd{display:none}
  canvas{touch-action:none;cursor:crosshair}
  .cells{display:grid;gap:0;justify-content:center;align-content:center}
  .cell{position:relative;background:#fff;border:1px solid var(--red)}
  .cell>*{position:absolute;inset:0;width:100%;height:100%}
  .cell .fallback{opacity:.9}
  button{font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--edge);border-radius:12px;
    padding:0 16px;height:48px;font-size:16px;font-weight:600;cursor:pointer;touch-action:manipulation}
  button:active{background:var(--btn2)}
  button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  button.pri{background:var(--red);color:#fff;border-color:var(--red);padding:0 26px}
  button.pri:active{background:#9d3422}
  button.sm{height:42px;padding:0 13px;font-size:15px}
  button:disabled{opacity:.4}
  footer{display:flex;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--edge);background:var(--paper)}
  footer .grp{display:flex;align-items:center;gap:8px}
  footer .sp{flex:1}
  .pills{display:flex;gap:6px}
  .pill{height:40px;font-size:14px;padding:0 14px;border-radius:20px}
  .pen{display:flex;gap:4px;align-items:center}
  .pen button{width:46px;padding:0;height:46px;display:flex;align-items:center;justify-content:center}
  .pen i{display:block;background:currentColor;border-radius:50%}
  #drawer{position:fixed;inset:0;background:rgba(20,18,12,.35);z-index:10;display:flex;justify-content:flex-end}
  #drawer[hidden]{display:none}
  #dpanel{width:min(520px,92vw);height:100%;background:var(--paper2);display:flex;flex-direction:column;
    padding-top:var(--safe-t);padding-bottom:var(--safe-b)}
  #dpanel .dh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--edge)}
  #dpanel .dh b{flex:1;font-size:17px}
  #dlist{flex:1;overflow:auto;padding:10px 14px 20px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
  .dsec{font-size:14px;font-weight:700;color:var(--red);padding:10px 2px 6px;position:sticky;top:-10px;background:var(--paper2);z-index:1}
  .dgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:6px}
  .dgrid button{height:56px;padding:0;font-size:28px;font-weight:500;border-radius:10px;font-family:"Hiragino Mincho ProN","Songti TC","Noto Serif CJK TC","Noto Serif KR","Apple Myungjo",serif}
    .dgrid button.cur{background:var(--red);color:#fff;border-color:var(--red)}
  .drow{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .drow .n{width:34px;font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
  .drow button{flex:1;height:56px;padding:0;font-size:28px;font-weight:500;border-radius:10px;
    font-family:"Hiragino Mincho ProN","Songti TC","Noto Serif CJK TC","Noto Serif KR","Apple Myungjo",serif}
    .drow button.cur{background:var(--red);color:#fff;border-color:var(--red)}
  #loading{position:fixed;inset:0;background:var(--paper);z-index:20;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;font-size:17px;color:var(--muted)}
  #loading b{font-size:56px;color:var(--ink);font-family:"Hiragino Mincho ProN","Songti TC","Noto Serif CJK TC",serif;font-weight:500}

  /* ---------- 휴대폰 대응 ---------- */
  button{white-space:nowrap}
  /* 세로 화면 (폰) */
  @media (max-width:700px){
    header{flex-wrap:wrap;gap:6px 8px;padding:6px 10px}
    header h1{display:none}
    .courses{margin-left:0;gap:4px;flex:1;min-width:0}
    .courses button{height:34px;font-size:13px;padding:0 10px;border-radius:17px}
    header .sp{display:none}
    #pos{order:5;flex-basis:100%;font-size:12px;line-height:1.2}
    #btnList{height:34px;font-size:13px;padding:0 10px}
    main{flex-direction:column}
    #left{flex:0 0 auto;display:grid;grid-template-columns:104px 1fr;column-gap:12px;align-items:center;
      padding:8px 12px;border-right:0;border-bottom:1px solid var(--edge)}
    #left .bigwrap{grid-row:1/span 5;flex:none;width:104px;height:104px}
    #left .reading{padding-top:0;justify-content:flex-start;gap:8px;flex-wrap:wrap}
    #left .reading .hun{font-size:20px}
    #left .reading .hun.long{font-size:16px}
    #left .reading .eum{font-size:26px}
    #left .meta,#left .xr,#left .idm{text-align:left;padding-top:2px;font-size:12px}
    #left .idm{font-size:12px;line-height:1.35}
    #left .idm b{font-size:14px}
    #left .phrase{justify-content:flex-start;gap:3px;padding-top:2px}
    #left .phrase .pc{width:46px;padding:2px 0}
    #left .phrase .pc b{font-size:20px}
    #left .phrase .pc i{font-size:10px;white-space:nowrap;overflow:hidden}
    #left .note{grid-column:1/-1;text-align:left;font-size:11px;padding-top:2px;min-height:0}
    #left .note:empty{display:none}
    #left .mrow{grid-column:1/-1;padding-top:6px}
    #left .mrow button{height:38px;font-size:14px}
    #right{padding:6px 10px}
    .panebar{min-height:0;padding-bottom:6px;gap:5px}
    .panebar .ttl{font-size:14px;flex-basis:100%;margin:0}
    .panebar .hint{display:none}
    button.sm{height:36px;padding:0 10px;font-size:13px}
    footer{flex-wrap:wrap;gap:6px 8px;padding:6px 10px}
    footer .sp{display:none}
    footer .grp{gap:5px}
    footer button{height:40px;font-size:14px;padding:0 10px}
    .pen button{width:38px;height:40px}
    .pills{order:2;flex:1 1 100%;justify-content:center}
    .pill{height:34px;font-size:12px;padding:0 10px}
    footer>.grp:first-child{flex:1 1 100%;justify-content:space-between}
    footer>.grp:last-child{order:3;flex:1 1 100%;justify-content:flex-end}
    footer>.grp:last-child button{flex:1}
    #toast{top:calc(96px + var(--safe-t))}
    .dgrid{grid-template-columns:repeat(5,1fr)}
    .dcgrid{grid-template-columns:repeat(3,1fr)}
  }
  /* 가로 화면이지만 높이가 낮은 경우 (폰 가로) */
  @media (min-width:701px) and (max-height:520px){
    header{padding:4px 12px;gap:8px}
    header h1{font-size:15px}
    .courses{margin-left:4px}
    .courses button{height:34px;font-size:13px;padding:0 10px}
    #pos{font-size:12px}
    #btnList{height:34px;font-size:13px;padding:0 10px}
    #left{flex-basis:34%;padding:6px 10px}
    #left .reading{padding-top:4px}
    #left .reading .hun{font-size:18px}
    #left .reading .hun.long{font-size:14px}
    #left .reading .eum{font-size:24px}
    #left .meta,#left .xr{font-size:12px;padding-top:2px}
    #left .phrase,#left .note,#left .idm{display:none}
    #left .mrow{padding-top:4px}
    #left .mrow button{height:36px;font-size:13px}
    #right{padding:4px 10px}
    .panebar{min-height:0;padding-bottom:4px;gap:5px}
    .panebar .ttl{font-size:13px;margin-right:2px}
    .panebar .hint{display:none}
    button.sm{height:34px;padding:0 9px;font-size:13px}
    footer{padding:4px 12px;gap:6px}
    footer button{height:38px;font-size:14px;padding:0 10px}
    .pen button{width:36px;height:38px}
    .pill{height:32px;font-size:12px;padding:0 10px}
    #toast{top:calc(50px + var(--safe-t))}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>漢字 연습장</h1>
    <div class="courses" id="courses"></div>
    <span class="sp"></span>
    <span id="pos"></span>
    <button class="sm" id="btnList">목록 · 이동</button>
  </header>
  <main>
    <section id="left"></section>
    <section id="right"></section>
  </main>
  <footer>
    <div class="grp">
      <button id="btnUndo">↩ 되돌리기</button>
      <button id="btnClear">지우기</button>
      <div class="pen" id="penSel" title="펜 굵기"></div>
    </div>
    <span class="sp"></span>
    <div class="pills" id="pills"></div>
    <span class="sp"></span>
    <div class="grp">
      <button id="btnPrev">◀ 이전</button>
      <button id="btnNext" class="pri">다음 ▶</button>
    </div>
  </footer>
</div>

<div id="drawer" hidden>
  <div id="dpanel">
    <div class="dh"><b id="dtitle">목록</b><button class="sm" id="btnBackup">백업·복원</button><button class="sm" id="btnCloseList">닫기</button></div>
    <div class="dtabs"><button id="tabActive" class="on">학습 중</button><button id="tabDone">학습 완료</button></div>
    <div id="dopts"></div>
    <div id="dlist"></div>
    <div id="dbackup" hidden></div>
  </div>
</div>
<div id="toast" hidden></div>
<div id="loading"><b>千</b><span id="loadmsg">획순 데이터를 불러오는 중…</span></div>

<script>
(function(){
'use strict';
var DATA=[], idx=0, scr=0, course='cj', cache={};
var COURSES={cj:{name:'천자문',file:'data.json',posKey:'cj-pos'},g3:{name:'3급 1817자',file:'data-grade3.json',posKey:'cj-pos-g3'},sj:{name:'사자성어 500',file:'data-idiom.json',posKey:'cj-pos-sj'}};            // scr: 0 = 획순 보며 쓰기, 1 = 반복 쓰기
var penSeen=false;
var store=new Map();                   // key -> [{w, p:[[x,y,pressure],...]}]
var hist=[];                           // undo stack of pad keys
var pads=new Map();                    // live pads on current screen
var settings={pen:0.02, guide:'row', cell:200, nums:true, skip:true, period:'7'};
var M={};                              // 학습 완료: key -> {t,k,i,c,x}
var animToken=0, demoShown=0, demoStrokes=[], demoBadges=[];

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
try{var s=JSON.parse(lsGet('cj-settings')||'null'); if(s) for(var k in s) if(k in settings) settings[k]=s[k];}catch(e){}
function loadM(){try{M=JSON.parse(lsGet('cj-mastered')||'{}')||{};}catch(e){M={};}}
function saveM(){lsSet('cj-mastered',JSON.stringify(M))}
function keyOf(rec){return course==='sj'?rec.w:rec.c}
function isM(rec){return !!M[keyOf(rec)]}
function mCount(){return Object.keys(M).length}
var DOW=['일','월','화','수','목','금','토'];
function fmtDate(t){var d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()}
var toastTimer=null;
function toast(msg,label,fn){
  var el=$('#toast');el.innerHTML='';
  var sp=document.createElement('span');sp.textContent=msg;el.appendChild(sp);
  if(label){var b=document.createElement('button');b.textContent=label;b.onclick=function(){el.hidden=true;fn()};el.appendChild(b)}
  el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.hidden=true},label?6000:3200);
}
function saveSettings(){lsSet('cj-settings',JSON.stringify(settings))}
function savePos(){lsSet(COURSES[course].posKey,JSON.stringify({idx:idx,scr:scr}))}
function K(){return course+idx}

var $=function(s,r){return (r||document).querySelector(s)};
var left=$('#left'), right=$('#right');
var FONT='"Hiragino Mincho ProN","Songti TC","Noto Serif CJK TC","Noto Serif KR","Apple Myungjo",serif';

/* ---------- SVG helpers ---------- */
function gridSvg(){
  return '<svg class="grid" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'+
    '<path d="M50 0V100M0 50H100" stroke-dasharray="4 4"/>'+
    '<path d="M0 0L100 100M100 0L0 100" stroke-dasharray="4 4" opacity=".55"/></svg>';
}
function glyphSvg(rec,fill){
  return '<svg viewBox="0 0 1024 1024" aria-hidden="true"><g transform="scale(1,-1) translate(0,-900)">'+
    rec.s.map(function(d){return '<path d="'+d+'" fill="'+fill+'"/>'}).join('')+'</g></svg>';
}
function fallbackHtml(rec,color,sizePx){
  return '<div class="fallback" style="color:'+color+';font-size:'+sizePx+'px">'+rec.c+'</div>';
}
function medianPath(m){return 'M'+m.map(function(p){return p[0]+' '+p[1]}).join(' L')}
function medianLen(m){var L=0;for(var i=1;i<m.length;i++){L+=Math.hypot(m[i][0]-m[i-1][0],m[i][1]-m[i-1][1])}return L}

/* ---------- Pad (handwriting canvas) ---------- */
function Pad(canvas,key){
  this.cv=canvas;this.key=key;this.ctx=canvas.getContext('2d');this.cur=null;this.pid=null;
  var self=this;
  canvas.addEventListener('pointerdown',function(e){self.down(e)});
  canvas.addEventListener('pointermove',function(e){self.move(e)});
  canvas.addEventListener('pointerup',function(e){self.up(e)});
  canvas.addEventListener('pointercancel',function(e){self.up(e)});
  canvas.addEventListener('contextmenu',function(e){e.preventDefault()});
}
Pad.prototype.list=function(){if(!store.has(this.key))store.set(this.key,[]);return store.get(this.key)};
Pad.prototype.size=function(){
  var r=this.cv.getBoundingClientRect();this.W=r.width;this.H=r.height;
  var d=Math.min(window.devicePixelRatio||1,3);
  this.cv.width=Math.max(1,Math.round(r.width*d));this.cv.height=Math.max(1,Math.round(r.height*d));
  this.ctx.setTransform(d,0,0,d,0,0);this.redraw();
};
Pad.prototype.mult=function(pr){return pr>0?0.45+pr*1.1:1};
Pad.prototype.seg=function(a,b,w){
  var c=this.ctx;c.lineCap='round';c.lineJoin='round';c.strokeStyle='#15130f';c.lineWidth=w*this.W;
  c.beginPath();c.moveTo(a[0]*this.W,a[1]*this.H);c.lineTo(b[0]*this.W,b[1]*this.H);c.stroke();
};
Pad.prototype.dot=function(p,w){
  var c=this.ctx;c.fillStyle='#15130f';c.beginPath();c.arc(p[0]*this.W,p[1]*this.H,w*this.W/2,0,Math.PI*2);c.fill();
};
Pad.prototype.redraw=function(){
  var c=this.ctx;c.clearRect(0,0,this.W,this.H);
  var L=this.list();
  for(var i=0;i<L.length;i++){
    var s=L[i],p=s.p;
    if(p.length===1){this.dot(p[0],s.w*this.mult(p[0][2]));continue}
    for(var j=1;j<p.length;j++){
      this.seg(p[j-1],p[j],s.w*(this.mult(p[j-1][2])+this.mult(p[j][2]))/2);
    }
  }
};
Pad.prototype.pt=function(e){
  var r=this.cv.getBoundingClientRect();
  var pr=(e.pointerType==='pen')?e.pressure:0;
  return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,pr];
};
Pad.prototype.down=function(e){
  if(e.pointerType==='pen')penSeen=true;
  if(e.pointerType==='touch'&&penSeen)return;      // 손바닥 오입력 방지
  if(e.pointerType==='mouse'&&e.button!==0)return;
  e.preventDefault();
  try{this.cv.setPointerCapture(e.pointerId)}catch(x){}
  this.pid=e.pointerId;
  var p=this.pt(e);
  this.cur={w:settings.pen,p:[p]};
  this.list().push(this.cur);hist.push(this.key);
  this.dot(p,this.cur.w*this.mult(p[2]));
};
Pad.prototype.move=function(e){
  if(!this.cur||e.pointerId!==this.pid)return;
  e.preventDefault();
  var evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];
  if(!evs.length)evs=[e];
  for(var i=0;i<evs.length;i++){
    var p=this.pt(evs[i]),q=this.cur.p[this.cur.p.length-1];
    if(Math.abs(p[0]-q[0])<1e-4&&Math.abs(p[1]-q[1])<1e-4)continue;
    this.cur.p.push(p);
    this.seg(q,p,this.cur.w*(this.mult(q[2])+this.mult(p[2]))/2);
  }
};
Pad.prototype.up=function(e){
  if(e.pointerId!==this.pid)return;
  this.cur=null;this.pid=null;
  try{this.cv.releasePointerCapture(e.pointerId)}catch(x){}
};

function demoReset(){
  animToken++;demoShown=0;
  demoStrokes.forEach(function(p){p.style.visibility='hidden';p.style.strokeDashoffset=p.dataset.len});
  demoBadges.forEach(function(b){b.classList.remove('on')});
}
function animStroke(el,token){
  return new Promise(function(res){
    var L=+el.dataset.len, dur=420+L*0.85, t0=null;
    el.style.strokeDashoffset=L;el.style.visibility='visible';
    function f(t){
      if(token!==animToken){res(false);return}
      if(t0===null)t0=t;
      var p=Math.min(1,(t-t0)/dur), e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      el.style.strokeDashoffset=L*(1-e);
      if(p<1)requestAnimationFrame(f);else res(true);
    }
    requestAnimationFrame(f);
  });
}
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
async function demoPlay(){
  demoReset();var token=animToken;
  for(var i=0;i<demoStrokes.length;i++){
    var ok=await animStroke(demoStrokes[i],token);
    if(!ok||token!==animToken)return;
    demoBadges[i].classList.add('on');demoShown=i+1;
    await wait(220);if(token!==animToken)return;
  }
}
async function demoStep(){
  if(demoShown>=demoStrokes.length)demoReset();
  animToken++;var token=animToken,i=demoShown;
  // 진행 중이던 획이 있으면 완성 상태로 맞춤
  demoStrokes.forEach(function(p,j){if(j<i){p.style.visibility='visible';p.style.strokeDashoffset=0}});
  var ok=await animStroke(demoStrokes[i],token);
  if(!ok)return;
  demoBadges[i].classList.add('on');demoShown=i+1;
}

    $('#dlist').innerHTML=h;dBuilt=false;
    $('#dlist').onclick=function(ev){
      var b=ev.target.closest('button.dchip');if(!b)return;
      $('#drawer').hidden=true;
      var k=b.dataset.k,i=+b.dataset.i;
      if(k===course){idx=i;scr=0;render()}else setCourse(k,false,{idx:i});
    };
  }
}
function openList(){
  $('#drawer').hidden=false;dBuilt=false;renderDrawer();
}
function exportJson(){
  var pos={};Object.keys(COURSES).forEach(function(k){pos[k]=lsGet(COURSES[k].posKey)});
  return JSON.stringify({v:1,mastered:M,pos:pos});
}
function openBackup(){
  var b=$('#dbackup');
  if(!b.hidden){b.hidden=true;return}
  b.innerHTML='<p>학습 완료 기록을 안전하게 보관하려면 아래 내용을 복사해서 메모 앱 등에 저장해 두세요. 기기를 바꾸거나 기록이 사라졌을 때는 저장해 둔 내용을 붙여 넣고 「불러오기」를 누르면 합쳐집니다.</p>'+
    '<textarea id="bkText" spellcheck="false"></textarea><div class="br"><button class="sm" id="bkCopy">복사</button><button class="sm" id="bkLoad">불러오기</button><button class="sm" id="bkClose">닫기</button></div>';
  $('#bkText').value=exportJson();b.hidden=false;
  $('#bkCopy').onclick=function(){
    var t=$('#bkText');t.focus();t.select();
    try{navigator.clipboard.writeText(t.value).then(function(){toast('복사했습니다.')},function(){toast('선택된 내용을 길게 눌러 복사해 주세요.')})}catch(e){toast('선택된 내용을 길게 눌러 복사해 주세요.')}
  };
  $('#bkLoad').onclick=function(){
    try{
      var d=JSON.parse($('#bkText').value),n=0;
      if(!d||typeof d.mastered!=='object')throw new Error('형식');
      for(var k in d.mastered){var e=d.mastered[k];if(e&&typeof e.t==='number'&&(!M[k]||e.t<M[k].t)){M[k]=e;n++}}
      saveM();renderDrawer();updateNav();toast('불러왔습니다. (새로 합쳐진 항목 '+n+'개)');
    }catch(e){toast('불러오지 못했습니다. 내용을 확인해 주세요.')}
  };
  $('#bkClose').onclick=function(){b.hidden=true};
}

/* ---------- Courses ---------- */
function updateCourseBtns(){
  var el=$('#courses');el.innerHTML='';
  Object.keys(COURSES).forEach(function(k){
    var b=document.createElement('button');b.className=(k===course?'on':'');b.textContent=COURSES[k].name;
    b.onclick=function(){if(k!==course)setCourse(k)};
    el.appendChild(b);
  });
}
function expandIdioms(d){
  var out=[];
  d.idioms.forEach(function(it){
    for(var k=0;k<4;k++){
      var c=it.w.charAt(k),pool=d.chars[c],o={};
      for(var key in pool)o[key]=pool[key];
      o.c=c;o.h=it.p[k][0];o.e=it.p[k][1];o.w=it.w;o.wr=it.r;o.wd=it.d;o.wl=it.lv;o.k=k;
      out.push(o);
    }
  });
  return out;
}
function loadData(c){
  if(cache[c])return Promise.resolve(cache[c]);
  var ld=$('#loading');ld.style.display='flex';$('#loadmsg').textContent='획순 데이터를 불러오는 중…';
  return fetch(COURSES[c].file).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
    if(c==='sj')d=expandIdioms(d);
    cache[c]=d;return d});
}
function setCourse(c,first,jump){
  if(!first)savePos();
  return loadData(c).then(function(d){
    course=c;DATA=d;lsSet('cj-course',c);dBuilt=false;hist=[];
    var p=null;try{p=JSON.parse(lsGet(COURSES[c].posKey)||'null')}catch(e){}
    idx=(p&&p.idx>=0&&p.idx<DATA.length)?p.idx:0;scr=(p&&p.scr)?1:0;
    if(jump){idx=Math.min(Math.max(0,jump.idx),DATA.length-1);scr=0}
    $('#loading').style.display='none';
    render();
  }).catch(function(err){
    $('#loadmsg').textContent='데이터를 불러오지 못했습니다. 새로고침해 주세요. ('+err.message+')';
  });
}

/* ---------- Boot ---------- */
$('#btnNext').onclick=next;$('#btnPrev').onclick=prev;
$('#btnUndo').onclick=undo;$('#btnClear').onclick=clearAll;
$('#btnList').onclick=openList;$('#btnCloseList').onclick=function(){$('#drawer').hidden=true};
$('#tabActive').onclick=function(){dtab='active';dBuilt=false;renderDrawer()};
$('#tabDone').onclick=function(){dtab='done';renderDrawer()};
$('#btnBackup').onclick=openBackup;
$('#drawer').addEventListener('click',function(e){if(e.target===this)this.hidden=true});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev();
});
['gesturestart','gesturechange'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()})});
var rt=null;
window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(layout,120)});
buildPenSel();

loadM();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
var c0=lsGet('cj-course');if(!COURSES[c0])c0='cj';
course=c0;updateCourseBtns();
setCourse(c0,true);
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
</body>
</html>
