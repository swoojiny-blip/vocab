<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현장 영단어 암기장</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="현장 영단어">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  /* 단일 다크 테마(사용자 요청). 레이아웃: 휴대폰 한 손 조작용 단일 컬럼, 주요 버튼은 하단 고정 */
  color-scheme: dark;
  --bg:#0b0d10;        /* 검정에 가까운 배경 */
  --surface:#14181d;   /* 카드 */
  --raised:#1b2027;    /* 눌리는 요소 */
  --line:#272d36;
  --text:#d8d3c6;      /* 순백 대신 따뜻한 회백색: 눈부심 감소 */
  --muted:#8a8f99;
  --accent:#74b4c8;    /* 도면 청록: 조작 요소 */
  --mark:#e2b663;      /* 안전 황색: 외울 단어 강조 */
  --good:#82c092;
  --bad:#dc8a76;
  --display:"Barlow Semi Condensed","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:16px 16px 120px;display:flex;flex-direction:column;gap:16px}
h1{font-size:20px;font-weight:600;margin:0;text-wrap:balance}
h2{font-size:15px;font-weight:600;margin:0;color:var(--muted);letter-spacing:.02em}
.top{display:flex;align-items:center;gap:12px;min-height:44px}
.top h1{flex:1}
.back{width:44px;height:44px;border-radius:12px;background:var(--surface);display:grid;place-items:center;font-size:20px;color:var(--accent)}
.sync{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-family:var(--display);font-size:28px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.2}
.stats span{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--raised);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.done i{background:var(--good)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:14px;background:var(--raised);border:1px solid var(--line);font-weight:500;width:100%}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0b1114;font-weight:600}
.btn.good{background:var(--good);border-color:var(--good);color:#0b140e;font-weight:600}
.btn.small{min-height:44px;width:auto;font-size:14px;padding:0 14px}
.btn:active{filter:brightness(1.15)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1}
.banner{border-color:var(--mark);display:flex;flex-direction:column;gap:12px}
.banner p{margin:0}
.major{padding:0;overflow:hidden}
.major>button{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left}
.major svg{width:36px;height:36px;flex:none;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.major .name{flex:1;display:flex;flex-direction:column;gap:6px}
.major .name b{font-weight:600}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.subs{border-top:1px solid var(--line);display:flex;flex-direction:column}
.subs button{display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left;border-bottom:1px solid var(--line);min-height:56px}
.subs button:last-child{border-bottom:0}
.subs .name{flex:1}
.chev{color:var(--muted)}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.ok{border-color:var(--good);color:var(--good)}
/* 학습 카드 */
.word{font-family:var(--display);font-size:40px;font-weight:600;color:var(--mark);line-height:1.15;overflow-wrap:anywhere;margin:0}
.where{font-size:12px;color:var(--muted)}
.ko{font-size:20px;font-weight:500;margin:0}
.ex{margin:0;padding-left:12px;border-left:2px solid var(--accent)}
.ex small{display:block;color:var(--muted);font-size:14px}
.tip{margin:0;font-size:14px;color:var(--muted);background:var(--raised);border-radius:10px;padding:10px 12px}
.tip b{color:var(--mark);font-weight:500}
.study{display:flex;flex-direction:column;gap:14px}
.reveal{min-height:64px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);width:100%}
.tools{display:flex;gap:8px;flex-wrap:wrap}
a.btn{text-decoration:none;color:var(--text)}
.spell{display:flex;flex-direction:column;gap:10px}
.spell label{font-size:14px;color:var(--muted)}
.spell input,.search{width:100%;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-family:var(--display);font-size:22px;letter-spacing:.04em}
.search{font-family:var(--body);font-size:16px;letter-spacing:0}
.area{width:100%;min-height:110px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:12px;font:13px/1.4 ui-monospace,monospace;overflow-wrap:anywhere}
.study h2{color:var(--text)}
.diff{font-family:var(--display);font-size:22px;letter-spacing:.04em;overflow-wrap:anywhere}
.diff .g{color:var(--good)} .diff .b{color:var(--bad);text-decoration:underline}
.ok{color:var(--good)} .no{color:var(--bad)}
.dock{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 28%);padding:24px 16px 16px}
.dock .in{max-width:528px;margin:0 auto;display:flex;gap:8px}
.dock .nav{flex:none;width:56px}
.list{display:flex;flex-direction:column;padding:0}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item div{flex:1;min-width:0}
.item b{font-family:var(--display);font-size:19px;font-weight:500;color:var(--mark);overflow-wrap:anywhere}
.item span{display:block;font-size:14px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opts .btn{justify-content:flex-start;text-align:left;padding:12px 16px;min-height:56px}
.opts .btn.right{border-color:var(--good);color:var(--good)}
.opts .btn.wrong{border-color:var(--bad);color:var(--bad)}
.q{font-size:13px;color:var(--muted)}
#photos{display:flex;flex-direction:column;gap:8px}
#photos:empty{display:none}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pics img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--raised);display:block}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* 단어 저장소: data/*.js 파일이 VOCAB.add(대분류, 소분류, 줄단위 텍스트)로 채웁니다.
   한 줄 = 단어|뜻|예문|예문 해석|암기 도움말(선택) */
window.VOCAB={words:[],seen:new Set(),add(major,sub,text){
  for(const line of text.split("\n")){
    const p=line.split("|").map(s=>s.trim());
    if(p.length<4||!p[0])continue;
    const k=p[0].toLowerCase();
    if(this.seen.has(k))continue;
    this.seen.add(k);
    this.words.push({w:p[0],ko:p[1],ex:p[2],exko:p[3],tip:p[4]||"",major,sub});
  }
}};
</script>
<script>
VOCAB.add("건설·토목","토공·기초",`
excavation|굴착, 터파기|Excavation must stop if groundwater appears.|지하수가 나오면 굴착을 중단해야 합니다.|ex(밖으로)+cav(파다). cave(동굴)와 같은 뿌리입니다.
backfill|되메우기|Backfill the trench in layers of 200 mm.|트렌치를 200mm 층으로 되메우십시오.|back(다시)+fill(채우다)
compaction|다짐|Check the compaction of each layer before the next one.|다음 층을 깔기 전에 각 층의 다짐을 확인하십시오.|compact(촘촘한)에서 나온 말입니다.
foundation|기초|The foundation drawings are not approved yet.|기초 도면이 아직 승인되지 않았습니다.
footing|기초판, 푸팅|Each column sits on an isolated footing.|기둥마다 독립 기초 위에 놓입니다.|foot(발)처럼 건물의 발바닥에 해당합니다.
pile|말뚝, 파일|The piles are driven to a depth of 18 metres.|말뚝은 18m 깊이까지 박습니다.

raft foundation|매트 기초, 전면 기초|Soft soil here requires a raft foundation.|이곳은 지반이 연약해 매트 기초가 필요합니다.|raft(뗏목)처럼 건물 전체를 한 판으로 받칩니다.
bearing capacity|지지력|The soil report gives a bearing capacity of 150 kN per square metre.|지반 보고서의 지지력은 제곱미터당 150kN입니다.
settlement|침하|We are monitoring settlement near the old building.|기존 건물 주변의 침하를 계측하고 있습니다.|settle(가라앉다)의 명사형입니다.
dewatering|배수, 물푸기|Dewatering pumps run day and night in this pit.|이 터파기 구간에서는 배수 펌프를 밤낮으로 가동합니다.|de(제거)+water
shoring|흙막이, 지보공|Shoring is required for excavation deeper than 1.5 metres.|1.5m보다 깊은 굴착에는 흙막이가 필요합니다.

trench|트렌치, 도랑|Lay the cable in the trench before backfilling.|되메우기 전에 케이블을 트렌치에 포설하십시오.
embankment|성토, 제방|The road runs on a three-metre embankment.|도로가 3m 높이의 성토 위로 지나갑니다.
subgrade|노상, 원지반|Roll the subgrade before placing the base course.|기층을 깔기 전에 노상을 전압하십시오.|sub(아래)+grade(지반 높이)
borehole|시추공|Three boreholes were drilled for the soil investigation.|지반 조사를 위해 시추공 세 개를 뚫었습니다.|bore(뚫다)+hole
water table|지하수위|The water table rises during the monsoon.|우기에는 지하수위가 올라갑니다.
plinth|플린스, 지반면 위 기단부|Finish the plinth beam before starting the brickwork.|조적 시작 전에 플린스 보를 마무리하십시오.|인도 현장에서 plinth level, plinth beam이라는 말을 매우 자주 씁니다.
anti-termite treatment|흰개미 방제 처리|Anti-termite treatment is done before the floor slab.|바닥 슬래브 전에 흰개미 방제 처리를 합니다.|인도 건축 공사에서 기초 단계의 표준 공정입니다.
`);
VOCAB.add("건설·토목","콘크리트·철근",`
concrete|콘크리트|The concrete arrived forty minutes late.|콘크리트가 40분 늦게 도착했습니다.
reinforcement|철근, 보강|Check the reinforcement before closing the formwork.|거푸집을 닫기 전에 철근을 확인하십시오.|re(다시)+inforce(힘을 넣다)

lap length|겹이음 길이|The lap length is too short on these bars.|이 철근들은 겹이음 길이가 너무 짧습니다.|lap은 겹치다라는 뜻입니다.

slump test|슬럼프 시험|Do a slump test on every truck.|차량마다 슬럼프 시험을 하십시오.|slump는 푹 주저앉다라는 뜻입니다.

segregation|재료 분리|Dropping concrete from a height causes segregation.|콘크리트를 높은 곳에서 떨어뜨리면 재료 분리가 생깁니다.
vibrator|진동기, 바이브레이터|Keep one spare vibrator at the pour.|타설 현장에 예비 진동기를 한 대 두십시오.
construction joint|시공 이음|Clean the construction joint before the next pour.|다음 타설 전에 시공 이음을 청소하십시오.
ready-mix concrete|레미콘|We order ready-mix concrete from the nearest plant.|가장 가까운 공장에서 레미콘을 주문합니다.|인도에서는 줄여서 RMC라고 부릅니다.
admixture|혼화제|Which admixture is used in this mix?|이 배합에는 어떤 혼화제를 씁니까?|ad(더하다)+mixture(혼합물)
water-cement ratio|물시멘트비|Do not add water; it changes the water-cement ratio.|물을 추가하지 마십시오. 물시멘트비가 바뀝니다.

VOCAB.add("건설·토목","구조·골조",`

`);
VOCAB.add("건설·토목","조적·마감",`

 "전기":'<path d="M20 3L8 20h9l-2 13 13-18h-9z"/>',
 "통신":'<path d="M18 16v16M12 32h12M10 10a11 11 0 0116 0M5 6a18 18 0 0126 0"/><circle cx="18" cy="15" r="2"/>',
 "현장 관리·감독":'<rect x="8" y="6" width="20" height="26" rx="2"/><path d="M14 6V3h8v3M13 15l3 3 6-6M13 25h10"/>'
};
const SEARCH_HINT={"건설·토목":"construction","기계설비":"mechanical","전기":"electrical","통신":"telecom","현장 관리·감독":"construction site"};

/* ---------- 상태 ---------- */
let S={learned:[],days:{},testsDone:0,tests:[],last:null,updated:0};
let view={name:"home"}, open=new Set(), syncNote="";
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&Array.isArray(r.learned))S=Object.assign(S,r)}catch(e){}}
function clean(){S.learned=[...new Set(S.learned)].filter(w=>BY.has(w));S.testsDone=Math.min(S.testsDone,Math.floor(S.learned.length/TEST_EVERY))}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function streak(){let n=0;const d=new Date();if(!S.days[today()])d.setDate(d.getDate()-1);
  for(;;){const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if(!S.days[k])break;n++;d.setDate(d.getDate()-1)}return n}
function save(){S.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}pushRemote()}

/* ---------- 기기 간 저장(계정별 비공개 문서) ---------- */
let ref=null,timer=null,writing=false,dirty=false;
function pushRemote(){if(!ref)return;dirty=true;clearTimeout(timer);timer=setTimeout(flush,1500)}
async function flush(){if(!ref||writing||!dirty)return;writing=true;dirty=false;
  try{await ref.set(JSON.parse(JSON.stringify(S)));setSync("저장됨")}
  catch(e){setSync("이 기기에만 저장됨")}
  writing=false;if(dirty)flush()}
function setSync(t){syncNote=t;const el=document.querySelector(".sync");if(el)el.textContent=t}
async function initRemote(){
  try{
    if(!window.claude||!claude.use)return setSync("이 기기에 저장됨");
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return setSync("이 기기에만 저장됨");
    const id=await user.id(); if(!id)return setSync("이 기기에만 저장됨");
    const r=db.doc("data/users/"+id+"/progress");
    const snap=await r.get(); ref=r;
    const d=snap.exists?snap.data():null;
    if(d&&Array.isArray(d.learned)&&(d.updated||0)>(S.updated||0)){
      S=Object.assign(S,JSON.parse(JSON.stringify(d)));clean();
      try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
      if(view.name==="home"||view.name==="learned")render();
      setSync("저장됨");
    }else if(S.updated){pushRemote()}else setSync("저장됨");
  }catch(e){setSync("이 기기에만 저장됨")}
}

/* ---------- 발음 ---------- */
let tts=null;
(async()=>{try{if(window.claude&&claude.use)tts=await claude.use("tts")}catch(e){}})();
/* 미국 영어 음성을 직접 지정합니다. 지정하지 않으면 기기 기본(한국어) 음성이 영어를 읽습니다. */
let enVoice=null;
function pickVoice(){try{
  const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
  const pref=["Google US English","Aria","Jenny","Samantha","Zira"];
  enVoice=vs.find(v=>pref.some(p=>v.name.includes(p)))||vs[0]||null}catch(e){}}
if("speechSynthesis" in window){pickVoice();try{speechSynthesis.addEventListener("voiceschanged",pickVoice)}catch(e){}}
function speak(text){
  try{
    if(tts){tts.speak(text,{language:"en-US",rate:0.85}).catch(()=>{});return}
    if("speechSynthesis" in window){speechSynthesis.cancel();if(!enVoice)pickVoice();
      const u=new SpeechSynthesisUtterance(text);u.lang="en-US";if(enVoice)u.voice=enVoice;u.rate=0.85;speechSynthesis.speak(u)}
  }catch(e){}
}

/* ---------- 도우미 ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s);
const app=$("#app");
const isL=w=>S.learned.includes(w);
function tree(){const m=new Map();for(const x of W){if(!m.has(x.major))m.set(x.major,new Map());const s=m.get(x.major);if(!s.has(x.sub))s.set(x.sub,[]);s.get(x.sub).push(x)}return m}
const TREE=tree();
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const norm=s=>s.trim().toLowerCase().replace(/\s+/g," ");
function testsDue(){return Math.floor(S.learned.length/TEST_EVERY)-S.testsDone}
function go(v){view=v;render();window.scrollTo(0,0)}
function bar(n,t){const p=t?Math.round(n/t*100):0;return `<div class="bar${n===t&&t?" done":""}"><i style="width:${p}%"></i></div>`}

/* ---------- 홈 ---------- */
function home(){
  const L=new Set(S.learned), total=W.length, due=testsDue();
  let h=`<div class="top"><h1>현장 영단어 암기장</h1><span class="sync">${esc(syncNote)}</span></div>
  <div class="card" style="display:flex;flex-direction:column;gap:14px">
    <div class="stats"><div><b>${L.size}</b><span>암기 완료 / ${total}</span></div><div><b>${S.days[today()]||0}</b><span>오늘 외운 단어</span></div><div><b>${streak()}</b><span>연속 학습일</span></div></div>
    ${bar(L.size,total)}
    <button class="btn primary" data-act="resume">이어서 암기하기</button>
  </div>`;
  if(due>0)h+=`<div class="card banner"><p><b>테스트 차례입니다.</b> ${S.testsDone*TEST_EVERY+1}~${(S.testsDone+1)*TEST_EVERY}번째로 외운 단어에서 ${TEST_SIZE}문제를 냅니다.</p><button class="btn primary" data-act="test">테스트 시작</button></div>`;
  h+=`<h2>분야별 단어</h2>`;
  for(const [major,subs] of TREE){
    const all=[...subs.values()].flat(), n=all.filter(x=>L.has(x.w)).length;
    h+=`<div class="card major"><button data-major="${esc(major)}" aria-expanded="${open.has(major)}">
      <svg viewBox="0 0 36 36" aria-hidden="true">${ICON[major]||""}</svg>
      <span class="name"><b>${esc(major)}</b>${bar(n,all.length)}</span><span class="count">${n}/${all.length}</span></button>`;
    if(open.has(major)){h+=`<div class="subs">`;
      for(const [sub,list] of subs){const k=list.filter(x=>L.has(x.w)).length;
        h+=`<button data-sub="${esc(major)}|${esc(sub)}"><span class="name">${esc(sub)}</span>${k===list.length?'<span class="pill ok">완료</span>':`<span class="count">${k}/${list.length}</span>`}<span class="chev">›</span></button>`}
      h+=`</div>`}
    h+=`</div>`;
  }
  h+=`<button class="btn" data-act="learned">암기 완료 목록 (${L.size})</button><button class="btn" data-act="backup">진도 백업 · 다른 기기로 옮기기</button>`;
  if(S.tests.length){const t=S.tests[S.tests.length-1];h+=`<p class="count" style="text-align:center;margin:0">최근 테스트 ${t.score}/${t.of}점 · ${esc(t.date)}</p>`}
  app.innerHTML=h;
}

/* ---------- 학습 ---------- */
function queue(major,sub){return TREE.get(major).get(sub).filter(x=>!isL(x.w))}
function startSub(major,sub){S.last=major+"|"+sub;const q=queue(major,sub);go({name:"study",major,sub,q,i:0,shown:false,spell:false})}
function resume(){
  if(S.last){const [m,s]=S.last.split("|");if(TREE.get(m)&&TREE.get(m).get(s)&&queue(m,s).length)return startSub(m,s)}
  for(const [m,subs] of TREE)for(const [s] of subs)if(queue(m,s).length)return startSub(m,s);
  go({name:"learned"});
}
function study(){
  const v=view, x=v.q[v.i];
  let h=`<div class="top"><button class="back" data-act="home" aria-label="홈으로">‹</button><h1>${esc(v.sub)}</h1><span class="count">${v.q.length?v.i+1:0}/${v.q.length}</span></div>`;
  if(!x){app.innerHTML=h+`<div class="card empty">이 분류의 단어를 모두 외우셨습니다.</div><button class="btn primary" data-act="resume">다음 분류로 이동</button>`;return}
  const img="https://www.google.com/search?tbm=isch&q="+encodeURIComponent(x.w+" "+(SEARCH_HINT[x.major]||""));
  h+=`<div class="card study">
    <span class="where">${esc(x.major)} › ${esc(x.sub)}</span>`;
  if(v.spell){
    h+=`<p class="ko">${esc(x.ko)}</p>
    <form class="spell" id="spellf"><label for="spell">뜻을 보고 영어 철자를 입력해 주세요</label>
      <input id="spell" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
      <div id="spellout" aria-live="polite"></div>
      <div class="row"><button class="btn primary" type="submit">확인</button><button class="btn" type="button" data-act="spelloff">단어 보기</button></div>
    </form>`;
  }else{
    h+=`<p class="word">${esc(x.w)}</p>`;
    h+=v.shown?`<p class="ko">${esc(x.ko)}</p>
      <p class="ex">${esc(x.ex)}<small>${esc(x.exko)}</small></p>
      ${x.tip?`<p class="tip"><b>암기 도움말</b> ${esc(x.tip)}</p>`:""}`
      :`<button class="reveal" data-act="show">뜻과 예문 보기</button>`;
    h+=`<div class="tools">
      <button class="btn small" data-act="say">발음 듣기</button>
      <button class="btn small" data-act="sayex">예문 듣기</button>
      ${window.claude?`<a class="btn small" href="${img}" target="_blank" rel="noopener">사진 검색</a>`:`<button class="btn small" data-act="photo">사진 보기</button>`}
      <button class="btn small" data-act="spellon">철자 쓰기</button>
    </div><div id="photos" data-img="${img}" aria-live="polite"></div>`;
  }
  h+=`</div>
  <div class="dock"><div class="in">
    <button class="btn nav" data-act="prev" aria-label="이전 단어">‹</button>
    <button class="btn good" data-act="done">암기 완료</button>
    <button class="btn nav" data-act="next" aria-label="다음 단어">›</button>
  </div></div>`;
  app.innerHTML=h;
  if(v.spell){const f=$("#spellf");f.addEventListener("submit",e=>{e.preventDefault();checkSpell(x.w,$("#spell").value,$("#spellout"))});$("#spell").focus()}
}
function checkSpell(target,typed,out){
  const a=norm(typed), b=norm(target);
  if(!a){out.innerHTML="";return false}
  if(a===b){out.innerHTML=`<span class="ok">정확합니다.</span> <span class="diff g">${esc(target)}</span>`;return true}
  let d="";for(let i=0;i<a.length;i++)d+=`<span class="${a[i]===b[i]?"g":"b"}">${esc(a[i])}</span>`;
  out.innerHTML=`<div class="diff">${d}</div><div class="no">정답: <span class="diff">${esc(target)}</span></div>`;return false;
}
function markDone(){
  const v=view, x=v.q[v.i]; if(!x)return;
  if(!isL(x.w)){S.learned.push(x.w);S.days[today()]=(S.days[today()]||0)+1}
  save(); v.q.splice(v.i,1); if(v.i>=v.q.length)v.i=0; v.shown=false; v.spell=false;
  if(S.learned.length%TEST_EVERY===0&&testsDue()>0)return go({name:"testintro"});
  render();
}

/* ---------- 사진: 화면 안에 표시(설치형·단일 파일에서만, 인터넷 필요) ---------- */
async function showPhotos(){
  const x=view.q[view.i], box=$("#photos"); if(!x||!box)return;
  const more=`<a class="btn small" href="${box.dataset.img}" target="_blank" rel="noopener">더 많은 사진 검색</a>`;
  box.innerHTML='<p class="count">사진을 불러오는 중입니다.</p>';
  try{
    const u="https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrlimit=8&prop=imageinfo&iiprop=url&iiurlwidth=320&format=json&origin=*&gsrsearch="+encodeURIComponent(x.w+" filetype:bitmap");
    const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),8000);
    const r=await fetch(u,{signal:ctl.signal}); clearTimeout(t);
    const j=await r.json();
    const pics=Object.values((j.query&&j.query.pages)||{}).sort((a,b)=>a.index-b.index).map(p=>p.imageinfo&&p.imageinfo[0]&&p.imageinfo[0].thumburl).filter(Boolean).slice(0,4);
    if(view.name!=="study"||view.q[view.i]!==x)return;
    const now=$("#photos"); if(!now)return;
    now.innerHTML=pics.length?`<div class="pics">${pics.map(p=>`<img src="${esc(p)}" alt="${esc(x.w)} 관련 사진" loading="lazy">`).join("")}</div><p class="count">사진 출처: Wikimedia Commons. 단어와 맞지 않는 사진이 섞일 수 있습니다.</p>${more}`
      :`<p class="count">이 단어는 맞는 사진을 찾지 못했습니다.</p>${more}`;
  }catch(e){const now=$("#photos"); if(now)now.innerHTML=`<p class="count">사진을 불러오지 못했습니다. 인터넷 연결을 확인해 주십시오.</p>${more}`}
}

/* ---------- 암기 완료 목록 ---------- */
function learned(){
  const q=norm(view.q||"");
  const list=S.learned.slice().reverse().map(w=>BY.get(w)).filter(x=>x&&(!q||x.w.toLowerCase().includes(q)||x.ko.includes(q)));
  let h=`<div class="top"><button class="back" data-act="home" aria-label="홈으로">‹</button><h1>암기 완료 목록</h1><span class="count">${S.learned.length}</span></div>
  <input class="search" id="search" type="search" placeholder="단어 또는 뜻 검색" value="${esc(view.q||"")}">`;
  h+=list.length?`<div class="card list">${list.map(x=>`<div class="item"><div><b>${esc(x.w)}</b><span>${esc(x.ko)} · ${esc(x.sub)}</span></div><button class="btn small" data-undo="${esc(x.w)}">다시 외우기</button></div>`).join("")}</div>`
    :`<div class="card empty">${S.learned.length?"검색 결과가 없습니다.":"아직 암기 완료한 단어가 없습니다. 단어를 외운 뒤 암기 완료를 누르시면 이곳으로 옮겨집니다."}</div>`;
  app.innerHTML=h;
  const s=$("#search");s.addEventListener("input",()=>{view.q=s.value;const p=s.selectionStart;learned();const n=$("#search");n.focus();n.setSelectionRange(p,p)});
}

/* ---------- 테스트 ---------- */
function startTest(){
  const pool=S.learned.slice(S.testsDone*TEST_EVERY,(S.testsDone+1)*TEST_EVERY).map(w=>BY.get(w)).filter(Boolean);
  const pick=shuffle(pool).slice(0,TEST_SIZE);
  const qs=pick.map((x,i)=>{
    if(i%5>=3)return {x,type:"spell"};
    const toKo=i%2===0, others=shuffle(W.filter(y=>y.w!==x.w&&y.major===x.major)).slice(0,3);
    return {x,type:"mc",toKo,opts:shuffle([x,...others])};
  });
  go({name:"test",qs,i:0,score:0,wrong:[],answered:false});
}
function testIntro(){
  app.innerHTML=`<div class="top"><h1>${S.learned.length}개 암기 달성</h1></div>
  <div class="card banner"><p>방금 외우신 ${TEST_EVERY}개 단어에서 ${TEST_SIZE}문제를 냅니다. 뜻 고르기 6문제와 철자 쓰기 4문제입니다.</p>
  <button class="btn primary" data-act="test">테스트 시작</button><button class="btn" data-act="home">나중에 하기</button></div>`;
}
function test(){
  const v=view, q=v.qs[v.i], x=q.x;
  let h=`<div class="top"><h1>테스트</h1><span class="count">${v.i+1}/${v.qs.length}</span></div>${bar(v.i,v.qs.length)}<div class="card study">`;
  if(q.type==="mc"){
    h+=`<span class="q">${q.toKo?"알맞은 뜻을 고르세요":"알맞은 영어 단어를 고르세요"}</span>
    <p class="${q.toKo?"word":"ko"}">${esc(q.toKo?x.w:x.ko)}</p>
    <div class="opts">${q.opts.map((o,k)=>`<button class="btn" data-opt="${k}">${esc(q.toKo?o.ko:o.w)}</button>`).join("")}</div>`;
  }else{
    h+=`<span class="q">뜻을 보고 영어 철자를 입력하세요</span><p class="ko">${esc(x.ko)}</p>
    <form class="spell" id="tspell"><input id="tin" type="text" aria-label="영어 철자" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
    <div id="tout" aria-live="polite"></div><button class="btn primary" type="submit" id="tsub">확인</button></form>`;
  }
  h+=`</div><div id="nextwrap"></div>`;
  app.innerHTML=h;
  if(q.type==="spell"){$("#tin").focus();$("#tspell").addEventListener("submit",e=>{e.preventDefault();if(v.answered)return;
    if(!norm($("#tin").value))return; const ok=checkSpell(x.w,$("#tin").value,$("#tout"));$("#tin").disabled=true;$("#tsub").hidden=true;answer(ok)})}
}
function answer(ok){const v=view;v.answered=true;if(ok)v.score++;else v.wrong.push(v.qs[v.i].x);
  $("#nextwrap").innerHTML=`<button class="btn primary" data-act="tnext">${v.i+1<v.qs.length?"다음 문제":"결과 보기"}</button>`}
function testNext(){const v=view;if(v.i+1<v.qs.length){v.i++;v.answered=false;return render()}
  S.testsDone++;S.tests.push({score:v.score,of:v.qs.length,date:today()});if(S.tests.length>100)S.tests.shift();save();
  go({name:"result",score:v.score,of:v.qs.length,wrong:v.wrong})}
function result(){const v=view;
  let h=`<div class="top"><h1>테스트 결과</h1></div><div class="card stats" style="grid-template-columns:1fr"><div><b>${v.score} / ${v.of}</b><span>${v.score===v.of?"모두 맞히셨습니다":"틀린 단어는 아래에서 다시 학습으로 돌릴 수 있습니다"}</span></div></div>`;
  if(v.wrong.length)h+=`<h2>틀린 단어</h2><div class="card list">${v.wrong.map(x=>`<div class="item"><div><b>${esc(x.w)}</b><span>${esc(x.ko)}</span></div>${isL(x.w)?`<button class="btn small" data-undo="${esc(x.w)}">다시 외우기</button>`:'<span class="pill">학습으로 이동됨</span>'}</div>`).join("")}</div>`;
  h+=`<button class="btn primary" data-act="${testsDue()>0?"test":"resume"}">${testsDue()>0?"다음 테스트":"이어서 암기하기"}</button><button class="btn" data-act="home">홈으로</button>`;
  app.innerHTML=h;
}

/* ---------- 진도 백업 · 복원 ---------- */
function backup(){
  const code=JSON.stringify({learned:S.learned,days:S.days,testsDone:S.testsDone,tests:S.tests,last:S.last});
  app.innerHTML=`<div class="top"><button class="back" data-act="home" aria-label="홈으로">‹</button><h1>진도 백업 · 옮기기</h1></div>
  <div class="card study"><h2>1. 이 기기의 진도 내보내기</h2>
    <p class="tip">아래 글자를 모두 복사해 메모나 메신저로 보관하시면 됩니다. 다른 기기로 옮길 때도 이 글자를 씁니다.</p>
    <textarea id="bkout" class="area" readonly aria-label="백업 코드"></textarea>
    <button class="btn primary" data-act="bkcopy">백업 코드 복사</button><div id="bkmsg" aria-live="polite"></div></div>
  <div class="card study"><h2>2. 백업 코드로 복원하기</h2>
    <p class="tip">복원하면 이 기기의 현재 진도는 백업 내용으로 바뀝니다.</p>
    <textarea id="bkin" class="area" aria-label="복원할 백업 코드" placeholder="백업 코드를 여기에 붙여 넣으십시오"></textarea>
    <button class="btn" data-act="bkrestore">이 코드로 복원</button><div id="bkmsg2" aria-live="polite"></div></div>`;
  $("#bkout").value=code;
}
function bkCopy(){const t=$("#bkout");t.focus();t.select();
  const done=()=>{$("#bkmsg").innerHTML='<span class="ok">복사했습니다.</span>'};
  try{navigator.clipboard.writeText(t.value).then(done,()=>{try{document.execCommand("copy");done()}catch(e){$("#bkmsg").textContent="글자를 길게 눌러 직접 복사해 주십시오."}})}
  catch(e){try{document.execCommand("copy");done()}catch(e2){$("#bkmsg").textContent="글자를 길게 눌러 직접 복사해 주십시오."}}}
function bkRestore(){const m=$("#bkmsg2");
  try{const d=JSON.parse($("#bkin").value.trim());if(!d||!Array.isArray(d.learned))throw 0;
    S.learned=d.learned;S.days=d.days||{};S.testsDone=d.testsDone||0;S.tests=d.tests||[];S.last=d.last||null;clean();save();
    m.innerHTML=`<span class="ok">복원했습니다. 암기 완료 ${S.learned.length}개.</span>`}
  catch(e){m.innerHTML='<span class="no">백업 코드가 올바르지 않습니다. 처음부터 끝까지 모두 붙여 넣었는지 확인해 주십시오.</span>'}}

/* ---------- 렌더 · 이벤트 ---------- */
function render(){({home,study,learned,test,testintro:testIntro,result,backup})[view.name]()}
app.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t)return;
  const d=t.dataset, v=view;
  if(d.major){open.has(d.major)?open.delete(d.major):open.add(d.major);return render()}
  if(d.sub){const [m,s]=d.sub.split("|");return startSub(m,s)}
  if(d.undo){S.learned=S.learned.filter(w=>w!==d.undo);clean();save();return render()}
  if(d.opt!==undefined){if(v.answered)return;const q=v.qs[v.i],ok=q.opts[+d.opt].w===q.x.w;
    app.querySelectorAll("[data-opt]").forEach((b,k)=>{if(q.opts[k].w===q.x.w)b.classList.add("right");else if(k===+d.opt)b.classList.add("wrong")});return answer(ok)}
  switch(d.act){
    case "home":return go({name:"home"});
    case "resume":return resume();
    case "learned":return go({name:"learned",q:""});
    case "backup":return go({name:"backup"});
    case "bkcopy":return bkCopy();
    case "bkrestore":return bkRestore();
    case "test":return startTest();
    case "tnext":return testNext();
    case "show":v.shown=true;return render();
    case "photo":return showPhotos();
    case "say":return speak(v.q[v.i].w);
    case "sayex":return speak(v.q[v.i].ex);
    case "spellon":v.spell=true;return render();
    case "spelloff":v.spell=false;v.shown=true;return render();
    case "done":return markDone();
    case "next":if(v.q.length){v.i=(v.i+1)%v.q.length;v.shown=false;v.spell=false;render()}return;
    case "prev":if(v.q.length){v.i=(v.i-1+v.q.length)%v.q.length;v.shown=false;v.spell=false;render()}return;
  }
});
load();clean();render();initRemote();
})();
</script>

try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
</script>
